name: Deploy to GitHub Pages

on:
  push:
    # master is the default branch today; main is here so a rename
    # does not silently stop deployments
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The official Astro action: installs, runs `npm run build`, and uploads
      # dist/ as the Pages artifact. It pins its own upload-pages-artifact,
      # so the artifact and deploy halves cannot drift out of step.
      - uses: withastro/action@v6
        with:
          # Pinned rather than left to the action's default, so a new default
          # cannot change the build under us. Satisfies engines: >=22.12.0.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
